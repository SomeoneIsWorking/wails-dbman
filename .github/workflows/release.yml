name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86-64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Linux desktop build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb xauth
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py check-tag --tag "$RELEASE_TAG"
      - name: Derive Wails package version from source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/release.py prepare-version --tag "$RELEASE_TAG"
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build
      - name: Test and build native Wails app
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0 build \
            -m -s -trimpath -nocolour -platform linux/amd64 -tags webkit2_41
      - name: Package and launch-check AppImage
        run: python tools/package_appimage.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbman-linux
          path: build/release/DBMan-linux-x86_64.AppImage
          if-no-files-found: error

  macos:
    name: macOS arm64 app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py check-tag --tag "$RELEASE_TAG"
      - name: Derive Wails package version from source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/release.py prepare-version --tag "$RELEASE_TAG"
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build
      - name: Test and build native Wails app
        run: |
          go vet ./...
          go test ./...
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0 build \
            -m -s -trimpath -nocolour -platform darwin/arm64
      - name: Package and inspect app bundle
        run: python tools/release.py macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbman-macos
          path: build/release/DBMan-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows x86-64 executable
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: python tools/release.py check-tag --tag $env:RELEASE_TAG
      - name: Derive Wails package version from source and tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: pwsh
        run: python tools/release.py prepare-version --tag "$env:RELEASE_TAG"
      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm run build
      - name: Test and build native Wails app
        shell: pwsh
        run: |
          go vet ./...
          go test ./...
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.11.0 build -m -s -trimpath -nocolour -platform windows/amd64
      - name: Package and inspect executable
        shell: pwsh
        run: python tools/release.py windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbman-windows
          path: build/release/DBMan-windows-x86_64.zip
          if-no-files-found: error

  publish:
    name: Publish verified desktop packages
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dbman-*
          path: build/release
          merge-multiple: true
      - name: Publish exact tagged packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -s build/release/DBMan-linux-x86_64.AppImage
          test -s build/release/DBMan-macos-arm64.zip
          test -s build/release/DBMan-windows-x86_64.zip
          gh release create "$RELEASE_TAG" build/release/* \
            --verify-tag --prerelease --title "DBMan $RELEASE_TAG preview" --generate-notes
